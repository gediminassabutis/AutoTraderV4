services:
  postgres:
    image: postgres:16-alpine
    container_name: autotraderv4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autotrader_v4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: autotraderv4-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@autotrader.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
